<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pool Control</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; background: #f4f7f8; color: #223; }
  h1 { font-size: 1.4rem; }
  h2 { font-size: 1rem; margin: 1.2rem 0 0.4rem; color: #467; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 6px; overflow: hidden; }
  td { padding: 0.4rem 0.8rem; border-bottom: 1px solid #eef2f4; }
  td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
  .on { color: #1a7f37; font-weight: 600; }
  .off { color: #99a; }
  .warn { background: #fff3cd; border: 1px solid #ffe08a; border-radius: 6px; padding: 0.6rem 0.8rem; margin: 0.8rem 0; }
  .muted { color: #789; font-size: 0.85rem; }
  button.toggle {
    font: inherit; cursor: pointer; min-width: 4.5rem;
    padding: 0.25rem 0.7rem; border-radius: 999px;
    border: 1px solid #cdd8dd; background: #eef2f4; color: #99a; font-weight: 600;
  }
  button.toggle.on { background: #1a7f37; border-color: #1a7f37; color: #fff; }
  button.toggle:disabled { opacity: 0.5; cursor: progress; }
  #toast { position: sticky; top: 0; margin: 0.4rem 0; min-height: 1.1rem; font-size: 0.85rem; color: #b45309; }
</style>
</head>
<body>
<h1>Pool Control</h1>
<p class="muted" id="updated">Loading…</p>
<div id="toast"></div>
<div id="warning" class="warn" hidden></div>
<h2>Mode</h2>
<table><tbody id="mode"></tbody></table>
<h2>Equipment</h2>
<table><tbody id="equipment"></tbody></table>
<h2>Sensors</h2>
<table><tbody id="sensors"></tbody></table>
<h2>Heat Settings</h2>
<table><tbody id="heat"></tbody></table>
<script>
const LABELS = {
  filter: 'Filter', lights: 'Lights', spaLights: 'Spa Lights', waterfall: 'Waterfall',
  solarHeater: 'Solar Heater', heater: 'Heater',
  airTemp: 'Air Temp', poolTemp: 'Pool Temp', spaTemp: 'Spa Temp', saltLevel: 'Salt Level',
  poolChlorinator: 'Pool Chlorinator', spaChlorinator: 'Spa Chlorinator',
  filterSpeed: 'Filter Speed', heaterMode: 'Heater Mode',
  spaHeater: 'Spa Heater', poolHeater: 'Pool Heater', spaSolar: 'Spa Solar', poolSolar: 'Pool Solar',
};
const UNITS = { airTemp: '°F', poolTemp: '°F', spaTemp: '°F', saltLevel: ' PPM' };

// Equipment keys the gateway accepts as a button-press toggle (POST /api/command/:action).
// 'heater' is driven by heat settings/mode, not a direct toggle, so it stays read-only.
const TOGGLEABLE = new Set(['filter', 'lights', 'spaLights', 'waterfall', 'solarHeater']);

let busy = false; // a command is in flight; pause auto-refresh so it doesn't clobber button state

function row(label, valueHtml) {
  return `<tr><td>${label}</td><td>${valueHtml}</td></tr>`;
}

function toggleButton(action, on, label) {
  const state = on === null ? '—' : on ? 'ON' : 'off';
  const cls = on ? 'toggle on' : 'toggle';
  const dis = on === null ? ' disabled' : '';
  return `<button class="${cls}" data-action="${action}" data-label="${label}"${dis}>${state}</button>`;
}

function render(s) {
  document.getElementById('updated').textContent =
    'Last update from gateway: ' + (s.lastUpdated ? new Date(s.lastUpdated).toLocaleString() : 'never');

  const warn = document.getElementById('warning');
  warn.hidden = !(s.system && s.system.checkSystem);
  if (!warn.hidden) warn.textContent = '⚠ Check System' + (s.system.message ? ' — ' + s.system.message : '');

  const controls = !!s.controlsEnabled;

  const modeText = s.mode ? s.mode.toUpperCase() : '—';
  document.getElementById('mode').innerHTML = row('Current mode', controls
    ? `<button class="toggle on" data-action="mode" data-label="Mode">${modeText}</button>`
    : modeText);

  document.getElementById('equipment').innerHTML = Object.entries(s.equipment)
    .map(([k, v]) => {
      const label = LABELS[k] || k;
      if (controls && TOGGLEABLE.has(k)) return row(label, toggleButton(k, v.on, label));
      return row(label, v.on === null ? '—' : v.on ? '<span class="on">ON</span>' : '<span class="off">off</span>');
    })
    .join('');

  document.getElementById('sensors').innerHTML = Object.entries(s.sensors)
    .map(([k, v]) => row(LABELS[k] || k, v === null ? '—' : v + (UNITS[k] || '')))
    .join('');

  document.getElementById('heat').innerHTML = Object.entries(s.heatSettings)
    .filter(([k]) => k !== 'lastUpdated')
    .map(([k, v]) => row(LABELS[k] || k,
      v.enabled === null ? '—' : v.enabled ? v.setPoint + '°F' : '<span class="off">Off</span>'))
    .join('');
}

function toast(msg) {
  document.getElementById('toast').textContent = msg;
}

async function refresh() {
  if (busy) return; // don't re-render buttons mid-command
  try {
    const res = await fetch('/api/status');
    render(await res.json());
  } catch (e) {
    document.getElementById('updated').textContent = 'API unreachable: ' + e.message;
  }
}

async function sendCommand(action, label, btn) {
  if (busy) return;
  busy = true;
  toast('');
  document.querySelectorAll('button.toggle').forEach((b) => { b.disabled = true; });
  btn.textContent = '…';
  try {
    const res = await fetch('/api/command/' + action, { method: 'POST' });
    const body = await res.json().catch(() => ({}));
    if (!res.ok || !body.success) {
      toast('Could not toggle ' + label + (body.error ? ' — ' + body.error : ''));
    }
  } catch (e) {
    toast('Could not toggle ' + label + ' — ' + e.message);
  } finally {
    busy = false;
    // The panel LED updates on the next poll cycle; give it a beat before re-rendering.
    setTimeout(refresh, 1200);
  }
}

document.addEventListener('click', (e) => {
  const btn = e.target.closest('button.toggle');
  if (!btn || btn.disabled) return;
  sendCommand(btn.dataset.action, btn.dataset.label, btn);
});

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
