services:
  pool-control:
    image: taylorlbird/pool-control:latest
    container_name: pool-control
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GATEWAY_URL=${GATEWAY_URL}
      - PORT=3000
      - POLL_INTERVAL=${POLL_INTERVAL:-500}
      - HEAT_SETTINGS_INTERVAL=${HEAT_SETTINGS_INTERVAL:-3600}
      - STATUS_PAGE_CONTROLS=${STATUS_PAGE_CONTROLS:-false}
